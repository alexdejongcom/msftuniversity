# The Briefing — scheduler.
# Static Web Apps' built-in API can't run timers, so GitHub calls it instead:
#   * finishes sending an issue in batches within the Azure send limits
#   * deletes sign-ups that were never confirmed (after 7 days)
#   * emails Alex when the next issue is due (every two weeks)
# Needs repository secret NL_CRON_KEY (same value as the SWA app setting).
name: Newsletter scheduler

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour
  workflow_dispatch:

concurrency:
  group: newsletter-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tick until done or rate-limited
        env:
          NL_CRON_KEY: ${{ secrets.NL_CRON_KEY }}
          SITE: https://msftuniversity.com
        run: |
          if [ -z "$NL_CRON_KEY" ]; then echo "NL_CRON_KEY secret not set — skipping"; exit 0; fi
          for i in $(seq 1 10); do
            out=$(curl -fsS -X POST -H "x-nl-key: $NL_CRON_KEY" "$SITE/api/newsletter/tick")
            echo "$out"
            pending=$(echo "$out" | jq -r '.pending // 0')
            wait=$(echo "$out" | jq -r '.waitSeconds // 0')
            # stop when nothing is queued, or the next slot is more than ~2 min away
            if [ "$pending" = "0" ] || [ "$wait" -gt 120 ]; then break; fi
            sleep $(( wait > 0 ? wait : 2 ))
          done
